services:
  arena:
    build: .
    image: slipstream-arena
    restart: unless-stopped
    # PORT sets the port of the server. The default is 27960.
    # Example: PORT=28000 docker compose up -d
    ports:
      - "${PORT:-27960}:${PORT:-27960}"
    environment:
      PORT: "${PORT:-27960}"
      SERVER_NAME: "Slipstream Arena server"
      MAX_CLIENTS: "12"
      # BOTS is the number of bots. "0" sets the bots to off.
      BOTS: "4"
      BOT_SKILL: "3"
      # "on": a bot leaves when a player joins. "off": the bot count is constant.
      BOT_FILL: "on"
      # "on": a player can jump one more time in the air.
      DOUBLE_JUMP: "off"
      # Password for the remote console (rcon), 8 characters or more. Empty sets the remote console to off.
      # Example: RCON_PASSWORD=my-secret-words docker compose up -d
      RCON_PASSWORD: "${RCON_PASSWORD:-}"
      FRAG_LIMIT: "20"
      TIME_LIMIT: "10"
      # Map rotation. The first map starts. Maps: yard, deck.
      MAPS: "yard,deck"
      # Seconds without damage after a spawn. "0" sets it to off.
      SPAWN_PROTECT: "2"
