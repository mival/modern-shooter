services:
  arena:
    build: .
    image: slipstream-arena
    restart: unless-stopped
    # PORT sets the port of the server. The default is 27960.
    # Example: PORT=28000 docker compose up -d
    ports:
      - "${PORT:-27960}:${PORT:-27960}"
    environment:
      PORT: "${PORT:-27960}"
      SERVER_NAME: "Slipstream Arena server"
      MAX_CLIENTS: "12"
      # BOTS is the number of bots. "0" sets the bots to off.
      BOTS: "4"
      BOT_SKILL: "3"
      # "on": a bot leaves when a player joins. "off": the bot count is constant.
      BOT_FILL: "on"
      # "on": a player can jump one more time in the air.
      DOUBLE_JUMP: "off"
      FRAG_LIMIT: "20"
      TIME_LIMIT: "10"
